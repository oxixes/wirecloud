services:
  wirecloud:
    image: oxixes/wirecloud:terrassa-demo
    volumes:
      - wirecloud-data:/opt/wirecloud_instance/data
      - wirecloud-static:/var/www/static
    environment:
      - DEBUG=True
    ports:
      - '80:8000'
    restart: always

volumes:
  wirecloud-data:
  wirecloud-static:
